<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">

        <title>Contact Me | Wheeler Ratings</title>
        <link rel="icon" type="image/x-icon" href="images/Golden_Star_PNG_Clip_Art_Image.png">
        <link rel="stylesheet" href="style.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Edu+QLD+Hand:wght@400..700&display=swap" rel="stylesheet">
    </head>
    <body>
        <header>
            <img src="images/Golden_Star_PNG_Clip_Art_Image.png" alt="golden star" width="20" height="20" class="logo-img">
            <h1>Wheeler Ratings</h1>
        </header>
        <nav class="tabs" aria-label="Main navigation">
            <a href="index.html">home</a>
            <a href="featured.html">featured reviews</a>
            <a href="reviews.html">reviews</a>
            <a href="toppicks.html">top picks</a>
        </nav>
        <main class="contact-page">
            <section class="contact-details">
                <h2>Contact Me</h2>
                <p>Email: <a href="mailto:aedennwheeler15@gmail.com">aedennwheeler15@gmail.com</a></p>
                <p>Phone: <a href="tel:+16092907309">609 290 7309</a></p>
            </section>
            <form class="contact-form">
                <h2>Send a Message</h2>
                <label for="contact-name">Name</label>
                <input id="contact-name" name="name" type="text" autocomplete="name">

                <label for="contact-email">Email</label>
                <input id="contact-email" name="email" type="email" autocomplete="email">

                <label for="contact-message">Message</label>
                <textarea id="contact-message" name="message" rows="5"></textarea>

                <button type="button" disabled>Send message</button>
            </form>
        </main>
    </body>
</html>
